name: Update 5Y Market Data Snapshot

on:
  schedule:
    # Runs every Sunday at 23:00 UTC
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch 5Y historical data & latest prices
        run: python scripts/fetch_market_data.py

      - name: Commit updated market-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/market-data.json
          git diff --staged --quiet || git commit -m "chore(data): update 5Y market data snapshot"
          git push
