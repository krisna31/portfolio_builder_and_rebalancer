name: Update 5Y Market Data Snapshot

on:
  schedule:
    # Runs every Sunday at 23:00 UTC
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install yfinance
        run: pip install --no-cache-dir "yfinance>=0.2.54,<0.3.0"

      - name: Fetch 5Y historical data & latest prices
        run: python scripts/fetch_market_data.py

      - name: Commit updated market-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/market-data.json
          git diff --staged --quiet || git commit -m "chore(data): update 5Y market data snapshot"
          git push
